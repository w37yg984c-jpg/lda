<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>唐詩主題圖譜 · LDA</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e8;
      --card: #fffdf8;
      --ink: #202d2a;
      --muted: #68736c;
      --line: #e8e2d6;
      --green: #34584c;
      --green-soft: #e9f0e9;
      --red: #b65e43;
      --gold: #c49a52;
      --shadow: 0 10px 32px rgb(48 55 44 / 6%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 90% 0%, rgb(196 154 82 / 12%), transparent 34rem),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }

    .page {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 58px 0 48px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 34px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif TC", "Songti TC", "SimSun", serif;
      font-size: clamp(34px, 6vw, 60px);
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 1.15;
    }

    .subtitle {
      max-width: 600px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .seal {
      display: grid;
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgb(182 94 67 / 45%);
      border-radius: 50%;
      color: var(--red);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 25px;
      line-height: 1;
      transform: rotate(8deg);
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 34px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgb(255 253 248 / 72%);
    }

    .stat {
      padding: 18px 22px;
    }

    .stat + .stat { border-left: 1px solid var(--line); }
    .stat-label { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .stat-value { margin-top: 3px; font-size: 20px; font-weight: 700; }
    .stat-value small { color: var(--muted); font-size: 12px; font-weight: 500; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ebe6db;
    }

    .tab {
      min-width: 104px;
      padding: 9px 16px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .tab[aria-pressed="true"] {
      background: var(--card);
      color: var(--green);
      box-shadow: 0 2px 8px rgb(48 55 44 / 9%);
    }

    .search {
      width: min(300px, 44vw);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--card);
      color: var(--ink);
      font-size: 14px;
    }

    .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(52 88 76 / 10%); }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 21px;
      font-weight: 600;
    }

    .result-count { color: var(--muted); font-size: 13px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .topic-card {
      position: relative;
      min-width: 0;
      padding: 22px 22px 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
      box-shadow: var(--shadow);
      animation: rise .35s both;
    }

    .topic-card::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(var(--gold), var(--green));
      content: "";
      opacity: .72;
    }

    .topic-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topic-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .topic-number {
      color: var(--green);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .characters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 18px 0 21px;
    }

    .character {
      display: grid;
      width: 34px;
      height: 36px;
      place-items: center;
      border: 1px solid #e7e9df;
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 17px;
      font-weight: 600;
    }

    .poems-label {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .poem {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid #f0ece4;
    }

    .poem-title {
      overflow-wrap: anywhere;
      font-family: "Noto Serif TC", "Songti TC", "SimSun", serif;
      font-size: 15px;
      font-weight: 600;
    }

    .poem-author { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .affinity { min-width: 62px; text-align: right; }
    .affinity-value { color: var(--green); font-size: 12px; font-weight: 700; }
    .meter { height: 3px; margin-top: 5px; overflow: hidden; border-radius: 4px; background: #e8e5da; }
    .meter span { display: block; height: 100%; border-radius: inherit; background: var(--gold); }

    .empty {
      grid-column: 1 / -1;
      padding: 48px 20px;
      border: 1px dashed #d8d0c2;
      border-radius: 13px;
      color: var(--muted);
      text-align: center;
    }

    .note {
      margin: 27px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .page { width: min(100% - 28px, 560px); padding-top: 35px; }
      .seal { width: 52px; height: 52px; font-size: 21px; }
      .overview { grid-template-columns: 1fr; }
      .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px; }
      .stat + .stat { border-top: 1px solid var(--line); border-left: 0; }
      .stat-value { margin: 0; font-size: 17px; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 440px) {
      .toolbar { align-items: stretch; flex-direction: column; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; }
      .tab { min-width: 0; }
      .search { width: 100%; }
      .topic-card { padding: 18px; }
      .characters { gap: 5px; }
      .character { width: 31px; height: 33px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

        <h1>唐詩主題圖譜</h1>
        <p class="subtitle">以字為粒度，從四萬餘首唐詩中觀察意象與語詞的聚合。切換主題數，看看詩意如何呈現不同的層次。</p>
      </div>

          <button class="tab" type="button" data-model="20" aria-pressed="false">20 個主題</button>
        </div>
        <input

      <div class="grid" id="topics"></div>
    </section>

    <p class="note">代表詩依文件在該主題中的機率排序（θ）；主題為無監督模型根據字詞共現推得，並非人工分類。所有資料均嵌入此頁，可離線開啟。</p>
  </main>

    const searchInput = document.querySelector("#search");
    const resultCount = document.querySelector("#result-count");
    const modelButtons = [...document.querySelectorAll("[data-model]")];
    let selectedModel = 10;

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function render() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const topics = topicData.filter((item) => {
        const content = [
          ...item.characters,
          ...item.poems.flatMap((poem) => [poem.title, poem.author]),
        ].join(" ").toLocaleLowerCase();
        return item.n === selectedModel && content.includes(query);
      });

      grid.replaceChildren();
      resultCount.textContent = `顯示 ${topics.length} / ${selectedModel} 個主題`;

      if (!topics.length) {
        grid.append(makeElement("div", "empty", "沒有符合搜尋條件的主題。"));
        return;
      }

      for (const item of topics) {
        const card = makeElement("article", "topic-card");
        card.style.animationDelay = `${Math.min(item.topic * 22, 300)}ms`;

        const topline = makeElement("div", "topic-topline");
        topline.append(
          makeElement("span", "topic-label", `LDA · ${item.n} topics`),
          makeElement("span", "topic-number", String(item.topic).padStart(2, "0")),
        );
        card.append(topline);

        const characters = makeElement("div", "characters");
        characters.setAttribute("aria-label", "前十個代表字");
        for (const character of item.characters) {
          characters.append(makeElement("span", "character", character));
        }
        card.append(characters, makeElement("div", "poems-label", "代表詩作"));

        for (const poem of item.poems) {
          const row = makeElement("div", "poem");
          const info = makeElement("div", "poem-info");
          info.append(
            makeElement("div", "poem-title", poem.title),
            makeElement("div", "poem-author", poem.author),
          );

          const affinity = makeElement("div", "affinity");
          affinity.append(makeElement("div", "affinity-value", `θ ${(poem.probability * 100).toFixed(1)}%`));
          const meter = makeElement("div", "meter");
          const fill = makeElement("span");
          fill.style.width = `${Math.max(0, Math.min(poem.probability * 100, 100))}%`;
          meter.append(fill);
          affinity.append(meter);

          row.append(info, affinity);
          card.append(row);
        }
        grid.append(card);
      }
    }

    for (const button of modelButtons) {
      button.addEventListener("click", () => {
        selectedModel = Number(button.dataset.model);
        for (const tab of modelButtons) {
          tab.setAttribute("aria-pressed", String(tab === button));
        }
        render();
      });
    }

    searchInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
